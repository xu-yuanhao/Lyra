[package]
name = "lyra-agent-runtime"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
chrono-tz.workspace = true
dirs.workspace = true
lyra-agent-api.workspace = true
lyra-agent-kernel.workspace = true
lyra-agent-plugins.workspace = true
lyra-runtime-protocol = { path = "../lyra-runtime-protocol" }
# Enable the real BPE tokenizer (o200k_base) so token estimates used for
# context-window trimming and memory checkpoints are accurate for CJK/code.
lyra-agent-reader = { workspace = true, features = ["tokenizer-tiktoken"] }
lyra-tool-fs-core.workspace = true
lyra-lsp-core = { path = "../lyra-lsp-core", default-features = false }
lyra-process-lifecycle-core.workspace = true
futures = { workspace = true, features = ["executor"] }
diffy.workspace = true
fs2.workspace = true
glob.workspace = true
hmac.workspace = true
image = { workspace = true, features = ["png", "jpeg", "webp", "gif"] }
libc.workspace = true
minijinja.workspace = true
rand.workspace = true
tiny_http.workspace = true
webbrowser.workspace = true
reqwest = { workspace = true, features = ["blocking", "http2", "json", "multipart", "rustls-tls", "system-proxy", "stream"] }
http.workspace = true
httpdate.workspace = true
rmcp = { workspace = true, features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
rmcp-reqwest = { package = "reqwest", version = "0.13.2", default-features = false }
bytes.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
shlex.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
tokio-util = { workspace = true }
toml.workspace = true
tree-sitter.workspace = true
tree-sitter-bash = "0.25"
url.workspace = true
urlencoding.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
which.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

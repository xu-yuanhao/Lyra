[package]
name = "lyrad"
version = "0.1.0"
edition = "2021"
license-file.workspace = true

[dependencies]
lyra-agent-runtime = { path = "../lyra-agent-runtime" }
lyra-download-core = { path = "../lyra-download-core" }
lyra-files-core = { path = "../lyra-files-core" }
lyra-lsp-core = { path = "../lyra-lsp-core", default-features = false }
lyra-runtime-protocol = { path = "../lyra-runtime-protocol" }
lyra-terminal-core = { path = "../lyra-terminal-core", default-features = false }
lyra-process-lifecycle-core = { path = "../lyra-process-lifecycle-core" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
semver.workspace = true
rayon = "1.10.0"
fs2.workspace = true
libc.workspace = true
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = "0.24.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
futures = "0.3.32"
http = "1.3.1"
url = "2.5.7"
uuid = { version = "1.11.0", features = ["v4"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
toml = "0.9.8"
sha2 = "0.10.9"
chrono = { version = "0.4.42", features = ["clock"] }
icu_calendar = "=2.1.1"
icu_calendar_data = "=2.1.1"
icu_collections = "=2.1.1"
icu_decimal = "=2.1.1"
icu_decimal_data = "=2.1.1"
icu_locale = "=2.1.1"
icu_locale_core = "=2.1.1"
icu_locale_data = "=2.1.2"
icu_normalizer = "=2.1.1"
icu_normalizer_data = "=2.1.1"
icu_properties = "=2.1.2"
icu_properties_data = "=2.1.2"
icu_provider = { version = "=2.1.1", features = ["sync"] }
ixdtf = "=0.6.4"
timezone_provider = "=0.1.2"
tinystr = "=0.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.23.0"

[[bin]]
name = "lyra-terminal-host"
path = "src/bin/lyra-terminal-host.rs"

[[bin]]
name = "lyra-files-host"
path = "src/bin/lyra-files-host.rs"

[[bin]]
name = "lyra-agent-host"
path = "src/bin/lyra-agent-host.rs"

[[bin]]
name = "lyra-scheduler-host"
path = "src/bin/lyra-scheduler-host.rs"

[workspace]
members = [
  "crates/lyra-agent-api",
  "crates/lyra-agent-kernel",
  "crates/lyra-agent-plugins",
  "crates/lyra-agent-runtime",
  "crates/lyra-agent-reader",
  "crates/lyra-bootstrap-core",
  "crates/lyra-bootstrap-installer",
  "crates/lyra-wasi-host",
  "crates/lyra-tool-fs-core",
  "crates/lyra-cli",
  "crates/lyrad",
  "crates/lyra-runtime-protocol",
  "crates/lyra-terminal-core",
  "crates/lyra-files-core",
  "crates/lyra-files-napi",
  "crates/lyra-image-core",
  "crates/lyra-image-napi",
  "crates/lyra-lsp-core",
  "crates/lyra-docs-core",
  "crates/lyra-docs-napi",
  "crates/lyra-download-core",
  "crates/lyra-accessibility-napi",
  "crates/lyra-process-lifecycle-core",
  "crates/lyra-computer-use-core",
]
exclude = [
  "archive/lyra-local-inference-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
# Internal
lyra-download-core = { path = "crates/lyra-download-core" }
lyra-files-core = { path = "crates/lyra-files-core" }
lyra-image-core = { path = "crates/lyra-image-core" }
lyra-agent-api = { path = "crates/lyra-agent-api" }
lyra-agent-kernel = { path = "crates/lyra-agent-kernel" }
lyra-agent-plugins = { path = "crates/lyra-agent-plugins" }
lyra-agent-runtime = { path = "crates/lyra-agent-runtime" }
lyra-agent-reader = { path = "crates/lyra-agent-reader" }
lyra-bootstrap-core = { path = "crates/lyra-bootstrap-core" }
lyra-bootstrap-installer = { path = "crates/lyra-bootstrap-installer" }
lyra-wasi-host = { path = "crates/lyra-wasi-host" }
lyra-docs-core = { path = "crates/lyra-docs-core" }
lyra-tool-fs-core = { path = "crates/lyra-tool-fs-core" }

lyra-process-lifecycle-core = { path = "crates/lyra-process-lifecycle-core" }

# External
age = "0.11.1"
allocative = "0.3.3"
ansi-to-tui = "7.0.0"
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
arc-swap = "1.9.0"
assert_cmd = "2"
assert_matches = "1.5.0"
async-channel = "2.3.1"
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = { version = "0.8", default-features = false }
base64 = "0.22.1"
bincode = "1.3"
blake3 = "1.8"
bm25 = "2.3.2"
bytes = "1.10.1"
chardetng = "0.1.17"
chrono = "0.4.43"
chrono-tz = "0.10.4"
clap = "4"
clap_complete = "4"

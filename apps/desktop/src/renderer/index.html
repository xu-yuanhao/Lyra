    <title>Lyra Workbench</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      html {
        color-scheme: light;
        color: #171717;
        background: transparent;
      }

      @media (prefers-color-scheme: dark) {
        html {
          color-scheme: dark;
          color: #f5f5f5;
        }
      }

      html[data-lyra-theme-tone="light"] {
        color-scheme: light;
        color: #171717;
      }

      html[data-lyra-theme-tone="dark"] {
        color-scheme: dark;
        color: #f5f5f5;
      }

      body {
        background: transparent;
      }

      /* First paint is only the mark. The window canvas stays behind it.
         The app background fades in once the mark has settled and the page is ready. */
      #app {
        opacity: 0;
      }

      body.lyra-startup-ready #app {
        opacity: 1;
        transition: opacity 0.16s ease;
      }

      #lyra-bootstrap-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: transparent;
        color: #171717;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        -webkit-app-region: drag;
        transition: opacity 0.16s ease;
      }

      body.lyra-startup-ready #lyra-bootstrap-screen {
        opacity: 0;
        pointer-events: none;
      }

      @media (prefers-color-scheme: dark) {
        #lyra-bootstrap-screen {
          color: #f5f5f5;
        }
      }

      html[data-lyra-theme-tone="light"] #lyra-bootstrap-screen {
        color: #171717;
      }

      html[data-lyra-theme-tone="dark"] #lyra-bootstrap-screen {
        color: #f5f5f5;
      }

      #lyra-bootstrap-screen[hidden] {
        display: none !important;
      }

      #lyra-bootstrap-logo {
        width: 72px;
        height: 72px;
        display: block;
        opacity: 0;
        transform: scale(0.72);
        transform-origin: center;
        animation: lyra-bootstrap-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes lyra-bootstrap-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        38% {
          opacity: 1;
          transform: scale(1.045);
        }

        58% {
          transform: scale(0.985);
        }

        76% {
          transform: scale(1.008);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #lyra-bootstrap-logo {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }
    </style>
  </head>
